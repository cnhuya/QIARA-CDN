<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" height="30" width="30">
  <!-- Lightning Bolt (moved 1px right, 1px up) -->
  <path
    d="M16 3 L10 12 L14 12 L12 19 L18 10 L14 10 Z"
    fill="#ccdaf5"
    stroke="#ccdaf5"
    stroke-width="1"
    stroke-linejoin="round"
    transform="translate(1 -1)"
  />

  <!-- Waves -->
  <g
    fill="none"
    stroke="#ccdaf5"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Top wave left side (curves down) -->
    <path d="M5 15 C7 13, 9 13, 11 15" />
    
    <!-- Top wave right side (U-shape - curves up) -->
    <path d="M19 15 C21 17, 23 17, 25 15" />

    <!-- Middle wave -->
    <path d="M5 20 C8 18, 12 18, 15 20 C18 22, 22 22, 25 20" />

    <!-- Bottom wave -->
    <path d="M5 25 C8 23, 12 23, 15 25 C18 27, 22 27, 25 25" />
  </g>
</svg>
